[xfce]
# Horizontal placement on the XFCE top panel.
# The chip sits left of the system tray. The workspace pager has no
# separate window, so we reserve pixels for it.

# Increase to move the chip left (away from the pager).
# Decrease to move it right (closer to the tray / clock).
pager_reserve = 200

# Extra gap between the chip and the pager, in pixels.
gap = 8

# Extra nudge in pixels. Positive = left, negative = right.
offset_x = 0

# Chip size. Height should match the panel (often 26–30).
min_width = 190
height = 26

# Used only if the tray position cannot be detected.
fallback_x = 900
